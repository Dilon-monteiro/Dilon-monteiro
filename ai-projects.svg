<svg xmlns="http://www.w3.org/2000/svg"
     width="800" height="250" viewBox="0 0 800 250"
     role="img" aria-labelledby="title desc">
  <title id="title">NutriGPT and Brain Tumor Detection in motion</title>
  <desc id="desc">
    NutriGPT selects a nutrition reference and builds an answer.
    A second animation scans an illustrated brain and activates a model output.
  </desc>

  <style>
    .title { font: 700 22px system-ui, sans-serif; fill: #f3f7fc }
    .sub { font: 14px system-ui, sans-serif; fill: #bac7d6 }
    .small { font: 13px monospace; fill: #c8d6df }
    .source { animation: select 6s ease infinite }
    .packet { animation: transfer 6s ease-in-out infinite }
    .answer { animation: write 6s ease infinite }
    .line2 { animation-delay: .2s }
    .line3 { animation-delay: .4s }
    .scan { animation: sweep 6s ease-in-out infinite }
    .feature { animation: detect 6s ease infinite }
    .output { animation: output 6s ease infinite }

    @keyframes select {
      0%,12% { opacity:.12 }
      25%,76% { opacity:1 }
      95%,100% { opacity:.12 }
    }
    @keyframes transfer {
      0%,26% { transform:translateX(0); opacity:0 }
      30% { transform:translateX(0); opacity:1 }
      46% { transform:translateX(42px); opacity:1 }
      49%,100% { transform:translateX(42px); opacity:0 }
    }
    @keyframes write {
      0%,46% { stroke-dashoffset:100; opacity:0 }
      47% { stroke-dashoffset:100; opacity:1 }
      65%,90% { stroke-dashoffset:0; opacity:1 }
      100% { stroke-dashoffset:0; opacity:0 }
    }
    @keyframes sweep {
      0%,8% { transform:translateY(0); opacity:0 }
      14% { transform:translateY(0); opacity:1 }
      60% { transform:translateY(72px); opacity:1 }
      67%,100% { transform:translateY(72px); opacity:0 }
    }
    @keyframes detect {
      0%,33% { opacity:.08 }
      46%,85% { opacity:1 }
      100% { opacity:.08 }
    }
    @keyframes output {
      0%,57% { opacity:.15 }
      69%,90% { opacity:1 }
      100% { opacity:.15 }
    }
    @media (prefers-reduced-motion: reduce) {
      .source,.packet,.answer,.scan,.feature,.output { animation:none }
      .scan,.packet { opacity:0 }
      .answer { stroke-dashoffset:0 }
    }
  </style>

  <!-- NutriGPT -->
  <rect x="2" y="2" width="390" height="246" rx="16"
        fill="#0d2023" stroke="#315752"/>
  <text x="22" y="39" class="title">NutriGPT</text>
  <text x="22" y="62" class="sub">Retrieval-augmented nutrition Q&amp;A</text>

  <rect x="22" y="79" width="343" height="31" rx="8" fill="#183638"/>
  <text x="34" y="100" class="small">Which foods contain iron?</text>

  <!-- Three passages, one selected source -->
  <g fill="#152d30" stroke="#395455">
    <rect x="24" y="127" width="128" height="17" rx="4"/>
    <rect x="24" y="149" width="128" height="17" rx="4"/>
    <rect x="24" y="171" width="128" height="17" rx="4"/>
  </g>
  <rect class="source" x="24" y="149" width="128" height="17" rx="4"
        fill="#215d51" stroke="#62f0be"/>
  <g stroke="#c3dcd4" stroke-width="2" stroke-linecap="round">
    <path d="M34 135h66 M34 157h92 M34 179h52"/>
  </g>

  <!-- Retrieved passage moves into the answer -->
  <path d="M153 157h59" stroke="#42786e" stroke-dasharray="3 4"/>
  <circle class="packet" cx="159" cy="157" r="4" fill="#89ffcf"/>

  <rect x="212" y="126" width="153" height="63" rx="9"
        fill="#142e30" stroke="#4d8c7b"/>
  <g fill="none" stroke="#85efbd" stroke-width="4"
     stroke-linecap="round" stroke-dasharray="100 102">
    <path class="answer" pathLength="100" d="M225 142h109"/>
    <path class="answer line2" pathLength="100" d="M225 157h89"/>
    <path class="answer line3" pathLength="100" d="M225 172h63"/>
  </g>
  <text x="24" y="218" class="small">Source passages</text>
  <text x="212" y="218" class="small">Grounded answer</text>

  <!-- Brain Tumor Detection -->
  <rect x="408" y="2" width="390" height="246" rx="16"
        fill="#19172a" stroke="#4b4566"/>
  <text x="428" y="39" class="title">Brain Tumor Detection</text>
  <text x="428" y="62" class="sub">MRI image classification</text>

  <!-- Original schematic illustration -->
  <g transform="translate(494 143)">
    <rect x="-61" y="-59" width="122" height="115" rx="10"
          fill="#111322" stroke="#433d59"/>
    <g fill="#393449" stroke="#a49bb8" stroke-width="2">
      <path d="M-3-43C-23-47-42-32-43-10
               C-49 10-37 33-23 40C-12 47-3 39-3 25Z"/>
      <path d="M3-43C23-47 42-32 43-10
               C49 10 37 33 23 40C12 47 3 39 3 25Z"/>
    </g>
    <g fill="none" stroke="#817891" stroke-width="2" stroke-linecap="round">
      <path d="M-30-26q19-3 12 13t8 15 M-35-1q17 2 14 17t9 12"/>
      <path d="M30-26q-19-3-12 13t-8 15 M35-1q-17 2-14 17t-9 12"/>
    </g>
    <g class="feature" fill="none" stroke="#ffabd9" stroke-width="2">
      <path d="M14-18h6m-6 0v6m19-6h-6m6 0v6
               M14 1h6m-6 0v-6m19 6h-6m6 0v-6"/>
    </g>
    <g class="scan">
      <rect x="-52" y="-42" width="104" height="8" fill="#87efff" opacity=".15"/>
      <path d="M-52-34H52" stroke="#8af3ff" stroke-width="2"/>
    </g>
  </g>

  <!-- Feature maps to model output -->
  <path d="M556 143h113" stroke="#78659a" stroke-dasharray="3 4"/>
  <g class="feature" fill="#bb9aef">
    <rect x="581" y="129" width="10" height="10" rx="2"/>
    <rect x="595" y="129" width="10" height="10" rx="2"/>
    <rect x="581" y="143" width="10" height="10" rx="2"/>
    <rect x="595" y="143" width="10" height="10" rx="2"/>
  </g>
  <g class="output">
    <rect x="665" y="117" width="97" height="52" rx="8"
          fill="#30253e" stroke="#efabd5"/>
    <path d="M681 151v-9m12 9v-19m12 19v-13m12 13v-24m12 24v-8"
          stroke="#ffc0e1" stroke-width="6"/>
  </g>
  <text x="436" y="218" class="small">MRI scan</text>
  <text x="645" y="218" class="small">Model output</text>
</svg>
